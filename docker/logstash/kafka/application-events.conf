input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["application-events"]
    group_id => "logstash-application-events"
    auto_offset_reset => "earliest"
    consumer_threads => 3
    codec => json
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "application-events-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
