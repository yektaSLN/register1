input {
  file {
    path => "/usr/share/logstash/app-logs/application-events.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/.sincedb"
    codec => json
  }
}
filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "application-events-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
